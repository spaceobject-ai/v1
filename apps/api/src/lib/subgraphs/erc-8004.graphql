# Agent.registration resolves through the AgentRegistrationData interface, and
# the deployed subgraph errors at the store level when the field is null. List
# queries filter on registration_not: null and single-agent handlers treat a
# query error as not found.
fragment AgentSummary on Agent {
  id: agentId
  owner {
    address: id
  }
  profile: registration {
    name
    description
    image
  }
  metadata {
    key
    value
  }
  feedbackCount: activeFeedbackCount
  createdAt
  createdAtTransaction
}

query GetAgent($id: ID!) {
  agent(id: $id) {
    ...AgentSummary
  }
}

query ListAgents($first: Int, $where: Agent_filter) {
  agents(first: $first, orderBy: agentId, orderDirection: asc, where: $where) {
    ...AgentSummary
  }
}

query SearchAgentProfiles($text: String!, $first: Int, $where: AgentRegistration_filter) {
  agentProfileSearch(text: $text, first: $first, where: $where) {
    agent {
      ...AgentSummary
    }
  }
}

query GetAgentServices($id: ID!) {
  agent(id: $id) {
    registration {
      ... on AgentRegistration {
        services(orderBy: position, orderDirection: asc) {
          id
          name
          kind
          endpoint
          version
          features(orderBy: position, orderDirection: asc) {
            kind
            value
          }
          attributes(orderBy: position, orderDirection: asc) {
            key
            value
            valueType
          }
        }
      }
    }
  }
}

query GetAgentFeedbacks($id: ID!, $first: Int, $skip: Int) {
  agent(id: $id) {
    feedback(
      first: $first
      skip: $skip
      orderBy: createdAt
      orderDirection: desc
      where: { isRevoked: false }
    ) {
      id
      client {
        address: id
      }
      value
      valueDecimals
      tag1
      tag2
      feedbackURI
      createdAt
      createdAtTransaction
    }
  }
}
